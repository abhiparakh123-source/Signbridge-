name: Build SIGNBRIDGE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_run:
    workflows: ["Build and smoke-test SIGNBRIDGE"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  android-apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Smoke-test built web application
        run: npm run test:smoke

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central can briefly rate-limit hosted runners (HTTP 429).
          # Retry the complete dependency/build step with backoff; never skip failures.
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Android build failed after 4 attempts."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Gradle build failed; retrying in ${delay}s (attempt $((attempt + 1))/4)."
            sleep "$delay"
          done

      - name: Verify APK and generate checksum
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SIGNBRIDGE-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
