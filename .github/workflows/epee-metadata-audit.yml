name: Audit CLERC Épée ASL metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths:
      - "services/isl-stream/training/audit_epee_metadata.py"
      - "services/isl-stream/training/test_audit_epee_metadata.py"
      - ".github/workflows/epee-metadata-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata-only downloader
        run: python -m pip install --upgrade huggingface_hub numpy
      - name: Download metadata and annotation JSON only
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="CLERC-DATA/epee",
              repo_type="dataset",
              allow_patterns=["metadata.csv", "annotations/*.json"],
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EPEE_DATASET_ROOT={path}\\n")
          print(f"Metadata and annotation JSON downloaded to: {path}")
          PY
      - name: Run full metadata and annotation audit
        run: |
          python services/isl-stream/training/audit_epee_metadata.py \
            --metadata "$EPEE_DATASET_ROOT/metadata.csv" \
            --dataset-root "$EPEE_DATASET_ROOT" \
            --output "$RUNNER_TEMP/epee-metadata-audit.json"
      - name: Publish audit report
        uses: actions/upload-artifact@v4
        with:
          name: signbridge-epee-metadata-audit
          path: ${{ runner.temp }}/epee-metadata-audit.json
          if-no-files-found: error
          retention-days: 14
