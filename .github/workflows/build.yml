name: Build and smoke-test SIGNBRIDGE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set up Python for ISL service checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile ISL service scaffold
        run: python -m compileall -q services/isl-stream
      - run: npm run build
      - run: npm run test:smoke
